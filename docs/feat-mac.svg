<svg xmlns="http://www.w3.org/2000/svg" width="560" height="320" viewBox="0 0 560 320">
  <defs>
    <linearGradient id="macbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171233"/><stop offset="1" stop-color="#0e0b1e"/>
    </linearGradient>
  </defs>
  <rect width="560" height="320" fill="url(#macbg)"/>

  <g font-family="-apple-system,'SF Pro Text',Segoe UI,sans-serif">
    <!-- volume -->
    <g>
      <text x="46" y="66" font-size="12.5" fill="#a49ec4">volume</text>
      <rect x="46" y="80" width="150" height="8" rx="4" fill="rgba(255,255,255,.12)"/>
      <rect x="46" y="80" width="60" height="8" rx="4" fill="#7c6cff">
        <animate attributeName="width" values="24;60;84;60" dur="3.2s" repeatCount="indefinite"/>
      </rect>
      <circle cx="106" cy="84" r="9" fill="#eae7f7" stroke="#7c6cff" stroke-width="3">
        <animate attributeName="cx" values="70;106;130;106" dur="3.2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- notification -->
    <g>
      <rect x="300" y="52" width="230" height="56" rx="14" fill="rgba(255,255,255,.07)" stroke="rgba(255,255,255,.18)">
        <animate attributeName="transform" values="0 14;0 0;0 0;0 14" keyTimes="0;0.12;0.85;1" dur="4s" repeatCount="indefinite"/>
      </rect>
      <circle cx="326" cy="80" r="12" fill="rgba(124,108,255,.25)" stroke="#7c6cff"/>
      <text x="322.5" y="85" font-size="12" fill="#b3a7ff">✦</text>
      <text x="348" y="76" font-size="12.5" font-weight="600" fill="#eae7f7">Nova</text>
      <text x="348" y="94" font-size="11.5" fill="#a49ec4">minuteur terminé — la pâte a reposé</text>
    </g>

    <!-- capture -->
    <g>
      <rect x="70" y="140" width="180" height="112" rx="10" fill="none" stroke="#7c6cff" stroke-width="1.6" stroke-dasharray="8 6">
        <animate attributeName="stroke-opacity" values="0.25;1;0.25" dur="2.2s" repeatCount="indefinite"/>
      </rect>
      <rect x="70" y="140" width="180" height="112" rx="10" fill="rgba(124,108,255,.06)"/>
      <text x="160" y="202" text-anchor="middle" font-size="12" fill="#b3a7ff">capture-2026.png</text>
      <!-- flash -->
      <rect x="70" y="140" width="180" height="112" rx="10" fill="#ffffff">
        <animate attributeName="opacity" values="0;0;0.55;0;0" keyTimes="0;0.42;0.48;0.56;1" dur="2.2s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- données réelles -->
    <g>
      <rect x="300" y="150" width="230" height="94" rx="16" fill="rgba(47,191,155,.08)" stroke="rgba(47,191,155,.4)"/>
      <g stroke="#2fbf9b" stroke-width="1.8" fill="none" stroke-linecap="round">
        <circle cx="328" cy="176" r="11"/><path d="M328 169v7l4.5 2.5"/>
        <path d="M420 166 a4.5 4.5 0 1 1 .8-8.9A6 6 0 0 1 432 159a3.5 3.5 0 0 1-1 7h-11z"/>
        <rect x="416" y="198" width="17" height="8" rx="2"/><line x1="435" y1="200.5" x2="435" y2="203.5"/>
      </g>
      <text x="348" y="180" font-size="12" fill="#9defd8">il est 14 h 32 · 22° éclaircies</text>
      <text x="348" y="200" font-size="12" fill="#9defd8">batterie 76 %, sur secteur</text>
      <text x="316" y="232" font-size="11" fill="#6e6a8f">lues en direct, jamais inventées</text>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
    </g>

    <text x="280" y="292" text-anchor="middle" font-size="13.5" fill="#a49ec4">sandbox : liste blanche d'actions, arguments validés, zéro commande libre</text>
  </g>
</svg>
