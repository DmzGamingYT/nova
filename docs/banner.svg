<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e0b1e"/>
      <stop offset="0.55" stop-color="#171233"/>
      <stop offset="1" stop-color="#241a4f"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c6cff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7c6cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4ad6c0" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4ad6c0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb" cx="0.38" cy="0.32" r="0.85">
      <stop offset="0" stop-color="#b3a7ff"/>
      <stop offset="0.35" stop-color="#7c6cff"/>
      <stop offset="0.8" stop-color="#4a3ddb"/>
      <stop offset="1" stop-color="#33249e"/>
    </radialGradient>
    <radialGradient id="glint" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cdc6ff"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>

  <!-- halos respirants -->
  <ellipse cx="290" cy="200" rx="330" ry="260" fill="url(#glowA)">
    <animate attributeName="rx" values="330;370;330" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;1;0.8" dur="7s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="1120" cy="90" rx="260" ry="200" fill="url(#glowB)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="9s" repeatCount="indefinite"/>
  </ellipse>

  <!-- orbites + satellites en rotation -->
  <g>
    <circle cx="290" cy="200" r="150" fill="none" stroke="#8f7dff" stroke-opacity="0.28" stroke-width="1.5"/>
    <circle cx="290" cy="200" r="118" fill="none" stroke="#8f7dff" stroke-opacity="0.14" stroke-width="1"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 290 200" to="360 290 200" dur="14s" repeatCount="indefinite"/>
      <circle cx="290" cy="50" r="7" fill="#8f7dff">
        <animate attributeName="opacity" values="0.55;1;0.55" dur="3.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="440" cy="200" r="5" fill="#4ad6c0" opacity="0.8"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360 290 200" to="0 290 200" dur="21s" repeatCount="indefinite"/>
      <circle cx="290" cy="350" r="4" fill="#b3a7ff" opacity="0.85"/>
      <circle cx="172" cy="200" r="3.5" fill="#8f7dff" opacity="0.6"/>
    </g>
  </g>

  <!-- orbe : halo pulsant + corps -->
  <circle cx="290" cy="200" r="96" fill="#7c6cff" opacity="0.25">
    <animate attributeName="r" values="96;112;96" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.28;0.08;0.28" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="290" cy="200" r="86" fill="url(#orb)">
    <animate attributeName="r" values="86;89;86" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <ellipse cx="262" cy="168" rx="30" ry="20" fill="url(#glint)">
    <animate attributeName="opacity" values="0.85;1;0.85" dur="3.2s" repeatCount="indefinite"/>
  </ellipse>

  <!-- wordmark -->
  <text x="440" y="188" font-family="-apple-system, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="92" font-weight="700" letter-spacing="10" fill="url(#title)">NOVA</text>
  <text x="446" y="242" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" font-weight="400" letter-spacing="1" fill="#b9b0e8">Assistante IA vocale — 100 % locale, propulsée par Groq</text>

  <!-- equalizer vocal animé -->
  <g fill="#7c6cff">
    <rect x="446" y="258" width="5" height="16" rx="2.5">
      <animate attributeName="height" values="16;30;8;22;16" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="y" values="258;251;262;255;258" dur="1.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="457" y="252" width="5" height="28" rx="2.5">
      <animate attributeName="height" values="28;12;32;18;28" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="252;260;248;257;252" dur="1.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="468" y="260" width="5" height="12" rx="2.5">
      <animate attributeName="height" values="12;34;10;26;12" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="260;249;263;253;260" dur="1.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="479" y="254" width="5" height="24" rx="2.5">
      <animate attributeName="height" values="24;36;14;30;24" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="254;246;259;251;254" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="490" y="259" width="5" height="14" rx="2.5">
      <animate attributeName="height" values="14;28;34;10;14" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="y" values="259;252;249;261;259" dur="1.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- pastilles -->
  <g font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#ded9ff">
    <rect x="446" y="300" width="152" height="40" rx="20" fill="#7c6cff" fill-opacity="0.16" stroke="#7c6cff" stroke-opacity="0.45"/>
    <text x="466" y="326" fill="#cfc7ff">🎤 Voix macOS</text>
    <rect x="612" y="300" width="196" height="40" rx="20" fill="#7c6cff" fill-opacity="0.16" stroke="#7c6cff" stroke-opacity="0.45"/>
    <text x="632" y="326" fill="#cfc7ff">⚡ 0 dépendance npm</text>
    <rect x="822" y="300" width="192" height="40" rx="20" fill="#7c6cff" fill-opacity="0.16" stroke="#7c6cff" stroke-opacity="0.45"/>
    <text x="842" y="326" fill="#cfc7ff">🛡️ Sandbox Mac</text>
  </g>
</svg>
