<svg xmlns="http://www.w3.org/2000/svg" width="560" height="320" viewBox="0 0 560 320">
  <defs>
    <linearGradient id="wbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171233"/><stop offset="1" stop-color="#0e0b1e"/>
    </linearGradient>
    <radialGradient id="waveorb" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#b3a7ff"/><stop offset="0.45" stop-color="#7c6cff"/><stop offset="1" stop-color="#33249e"/>
    </radialGradient>
  </defs>
  <rect width="560" height="320" fill="url(#wbg)"/>

  <g font-family="-apple-system,'SF Pro Text',Segoe UI,sans-serif">
    <!-- « Nova » entendu : ondes concentriques -->
    <circle cx="150" cy="140" r="20" fill="none" stroke="#7c6cff" stroke-width="2">
      <animate attributeName="r" values="20;64" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.7;0" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="140" r="20" fill="none" stroke="#7c6cff" stroke-width="2">
      <animate attributeName="r" values="20;64" dur="2s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.7;0" dur="2s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <text x="150" y="146" text-anchor="middle" font-size="15" font-weight="600" fill="#cdc6ff">« Nova »</text>
    <text x="150" y="196" text-anchor="middle" font-size="12" fill="#a49ec4">le mot d'activation</text>

    <!-- liaison -->
    <path d="M215 140 h80" stroke="#7c6cff" stroke-width="2" stroke-dasharray="5 7" opacity="0.6">
      <animate attributeName="stroke-dashoffset" values="0;-24" dur="1.1s" repeatCount="indefinite"/>
    </path>

    <!-- l'orbe s'éveille -->
    <circle cx="370" cy="140" r="46" fill="url(#waveorb)">
      <animate attributeName="r" values="40;50;40" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <ellipse cx="352" cy="120" rx="15" ry="10" fill="#fff" opacity="0.8"/>
    <!-- carillon -->
    <g stroke="#f5a83c" stroke-width="2.4" stroke-linecap="round">
      <path d="M430 128 l6 6 10 -12"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.6s" repeatCount="indefinite"/></path>
    </g>
    <text x="370" y="216" text-anchor="middle" font-size="12" fill="#a49ec4">elle s'éveille, écoute, répond</text>

    <!-- se rendort -->
    <g>
      <circle cx="490" cy="250" r="14" fill="none" stroke="#6e6a8f" stroke-width="2"/>
      <path d="M496 250 a6 6 0 1 0 -6 6" stroke="#6e6a8f" stroke-width="2" fill="none" stroke-linecap="round">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2.6s" repeatCount="indefinite"/>
      </path>
      <text x="490" y="286" text-anchor="middle" font-size="11.5" fill="#6e6a8f">puis se rendort</text>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.6s" repeatCount="indefinite"/>
    </g>

    <text x="280" y="52" text-anchor="middle" font-size="13.5" fill="#a49ec4">comme Siri : un mot, et elle est là — jamais de faux réveil par sa propre voix</text>
  </g>
</svg>
