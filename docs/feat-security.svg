<svg xmlns="http://www.w3.org/2000/svg" width="560" height="320" viewBox="0 0 560 320">
  <defs>
    <linearGradient id="secbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171233"/><stop offset="1" stop-color="#0e0b1e"/>
    </linearGradient>
  </defs>
  <rect width="560" height="320" fill="url(#secbg)"/>

  <g font-family="-apple-system,'SF Pro Text',Segoe UI,sans-serif">

    <!-- bouclier central qui respire -->
    <g transform="translate(280,118)">
      <circle r="86" fill="none" stroke="rgba(47,191,155,.22)" stroke-width="1.5">
        <animate attributeName="r" values="78;92;78" dur="3.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".7;.25;.7" dur="3.6s" repeatCount="indefinite"/>
      </circle>
      <circle r="86" fill="none" stroke="rgba(47,191,155,.14)" stroke-width="1.5">
        <animate attributeName="r" values="92;104;92" dur="3.6s" begin="1.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".5;0;.5" dur="3.6s" begin="1.2s" repeatCount="indefinite"/>
      </circle>
      <path d="M0 -46 l34 12 v26 c0 21 -14 36 -34 42 c-20 -6 -34 -21 -34 -42 v-26 z"
            fill="rgba(47,191,155,.12)" stroke="#2fbf9b" stroke-width="2.4"/>
      <path d="M-13 2 l10 10 18 -20" stroke="#2fbf9b" stroke-width="3" fill="none"
            stroke-linecap="round" stroke-linejoin="round">
        <animate attributeName="stroke-dasharray" values="0 40;40 0" dur="2.4s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- données locales : dossier qui ne sort pas -->
    <g>
      <rect x="34" y="212" width="200" height="64" rx="16" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.16)"/>
      <text x="52" y="238" font-size="13" font-weight="600" fill="#eae7f7">data/ · sur ton disque</text>
      <text x="52" y="259" font-size="11.5" fill="#a49ec4">mémoire · profil · sport</text>
      <!-- mur qui repousse une bulle tentante de sortir -->
      <line x1="234" y1="222" x2="234" y2="266" stroke="#2fbf9b" stroke-width="2.5" stroke-linecap="round"/>
      <g>
        <circle cx="262" cy="244" r="10" fill="rgba(124,108,255,.3)" stroke="#7c6cff" stroke-width="1.6"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;-16 0;0 0" dur="2.8s" repeatCount="indefinite"/>
      </g>
      <text x="286" y="248" font-size="11" fill="#6e6a8f">rien ne sort</text>
    </g>

    <!-- checksum : hash + coche -->
    <g>
      <rect x="326" y="212" width="200" height="64" rx="16" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.16)"/>
      <text x="344" y="236" font-size="11.5" fill="#a49ec4" font-family="ui-monospace,Menlo,monospace">sha-256 01c7cba6…</text>
      <path d="M346 252 l6 6 11 -13" stroke="#2fbf9b" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <animate attributeName="stroke-dasharray" values="0 30;30 0" dur="2s" repeatCount="indefinite"/>
      </path>
      <text x="372" y="258" font-size="11.5" fill="#eae7f7">téléchargement vérifié</text>
    </g>

    <!-- clé de confirmation en haut -->
    <g>
      <rect x="196" y="26" width="168" height="30" rx="15" fill="rgba(245,168,60,.12)" stroke="rgba(245,168,60,.5)"/>
      <text x="218" y="46" font-size="12" fill="#f5c98a">chaque action : « Autoriser ? »</text>
    </g>
  </g>
</svg>
