name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run test suite
        env:
          # Aucun appel réseau : la suite démarre le serveur sans clé Groq.
          GROQ_API_KEY: ''
        run: npm test

  win:
    name: Installateur Windows (x64)
    runs-on: windows-latest
    # Après le job mac : la release du tag (notes + checksums) existe déjà,
    # l'installeur s'y joint sans course, et complète le SHA256SUMS.txt.
    needs: [test, dmg]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      # Le cœur embarqué est régénéré (gitignored) puis packagé en
      # extraResources par electron-builder — l'app Windows embarque
      # son propre serveur Nova, comme sur macOS.
      - name: Sync embedded core
        working-directory: desktop
        run: node tools/sync-core.js

      - name: Build Windows installer (NSIS x64)
        working-directory: desktop
        run: npx electron-builder --win --x64 --config electron-builder.yml --publish never
        shell: pwsh

      - name: Upload artifact (every build)
        uses: actions/upload-artifact@v4
        with:
          name: Nova-Windows-x64
          path: desktop/release/*.exe
          if-no-files-found: error
          retention-days: 30

      # Release non signée : l'exe est joint à la release du tag, et son
      # hash complète le SHA256SUMS.txt généré par le job mac.
      - name: Attach installer + checksum to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release download "$GITHUB_REF_NAME" -p SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          ( cd desktop/release && sha256sum *.exe ) >> SHA256SUMS.txt
          gh release upload "$GITHUB_REF_NAME" desktop/release/*.exe SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --clobber

  dmg:
    name: DMG macOS (arm64)
    runs-on: macos-latest
    needs: test
    outputs:
      signed: ${{ steps.flag.outputs.signed }}
    env:
      # Identité de signature (ex. "Developer ID Application: Prénom Nom (TEAMID)").
      # Absente → build ad-hoc non signé (aucune erreur, artefact téléchargeable).
      CSC_NAME: ${{ secrets.CSC_NAME }}
      # Credentials de notarisation (App Store Connect / notarytool).
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      # Historique complet + tags : nécessaire pour retrouver le tag
      # précédent et générer le changelog de la release.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - id: flag
        name: Detect signing mode
        run: |
          if [ -n "$CSC_NAME" ]; then
            echo "signed=true"  >> "$GITHUB_OUTPUT"
            echo "🔐 Signature Developer ID + notarisation activées (CSC_NAME)"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "🔓 Secret CSC_NAME absent — build ad-hoc non signé"
            # Désactive l'auto-découverte de certificat : sans ça,
            # electron-builder peut échouer s'il cherche une identité.
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
          fi

      - name: Import Developer ID certificate
        if: env.CSC_NAME != ''
        env:
          CERT_P12: ${{ secrets.MACOS_CERTIFICATE }}          # .p12 exporté, encodé base64
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PWD }} # mot de passe du .p12
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'nova-ci-keychain' }}
        run: |
          TMPDIR_CERT=$(mktemp -d)
          KEYCHAIN_PATH="$RUNNER_TEMP/nova-build.keychain-db"

          echo "$CERT_P12" | base64 --decode > "$TMPDIR_CERT/cert.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$TMPDIR_CERT/cert.p12" \
            -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | tr -d '"')

          rm -rf "$TMPDIR_CERT"

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      # Tags v* → build + signature + notarisation + publication des
      # artefacts (DMG, ZIP, latest-mac.yml) sur un brouillon de release
      # GitHub : c'est ce que lit electron-updater. Publie le brouillon
      # depuis la page Releases pour livrer la mise à jour à tout le monde.
      - name: Build, sign & notarize
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # publication electron-updater (tags)
        run: |
          # Publication electron-updater UNIQUEMENT si signé (le ZIP doit
          # l'être pour que Squirrel accepte l'installation).
          if [[ "$GITHUB_REF" == refs/tags/v* && -n "$CSC_NAME" ]]; then
            npx electron-builder --mac --arm64 --config electron-builder.yml --publish always
          else
            npx electron-builder --mac --arm64 --config electron-builder.yml --publish never
          fi

      # Checksums SHA-256 + notes de release (changelog depuis le tag
      # précédent). Seulement pour les tags : sur main il n'y a pas de
      # bornes de comparaison — l'artefact reste DMG + ZIP seuls.
      - name: Generate SHA-256 checksums & release notes
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          NOVA_SIGNED: ${{ steps.flag.outputs.signed }}
        run: |
          chmod +x tools/gen-release-notes.sh
          ./tools/gen-release-notes.sh "${GITHUB_REF_NAME}" desktop/release

      - name: Upload artifact (every build)
        uses: actions/upload-artifact@v4
        with:
          name: Nova-macOS-arm64
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/SHA256SUMS.txt
            desktop/release/release-notes.md
          if-no-files-found: error
          retention-days: 30

      # Release « simple » uniquement pour les builds non signés : quand
      # electron-builder publie lui-même, il crée le brouillon complet
      # (DMG + ZIP + latest-mac.yml) et softprops ne doit pas entrer en conflit.
      # Les notes (changelog + checksums) sont dans release-notes.md ; les
      # notes auto de GitHub (« Full Changelog ») sont ajoutées après.
      - name: Attach to GitHub Release (unsigned tags only)
        if: startsWith(github.ref, 'refs/tags/v') && steps.flag.outputs.signed == 'false'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/release/*.dmg
            desktop/release/SHA256SUMS.txt
          body_path: desktop/release/release-notes.md
          generate_release_notes: true

      # Build signé : electron-builder a déjà publié le brouillon
      # (DMG + ZIP + latest-mac.yml, ce que lit electron-updater). On
      # enrichit ce brouillon : notes (changelog + checksums) + fichier
      # SHA256SUMS.txt en pièce jointe.
      - name: Enrich signed draft release (checksums + changelog)
        if: startsWith(github.ref, 'refs/tags/v') && steps.flag.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" desktop/release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" --draft \
            --notes-file desktop/release/release-notes.md
