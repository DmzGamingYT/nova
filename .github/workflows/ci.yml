name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run test suite
        env:
          # Aucun appel réseau : la suite démarre le serveur sans clé Groq.
          GROQ_API_KEY: ''
        run: npm test

  dmg:
    name: DMG macOS (arm64)
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      - name: Build DMG (Apple Silicon)
        working-directory: desktop
        run: npm run dist

      - name: Upload artifact (every build)
        uses: actions/upload-artifact@v4
        with:
          name: Nova-macOS-arm64
          path: desktop/release/*.dmg
          if-no-files-found: error
          retention-days: 30

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/release/*.dmg
          generate_release_notes: true
