appId: app.nova.assistant
productName: Nova
copyright: Nova — Assistant IA vocal

directories:
  output: release
  buildResources: assets

files:
  - main.js
  - preload.js
  - assets/**/*

# electron-updater doit être présent en clair sur le disque : il lance des
# binaires auxiliaires et l'auto-mise à jour ne marche pas depuis app.asar.
asarUnpack:
  - "**/node_modules/electron-updater/**"

# Cœur embarqué (server.js + public/ + lib/, copiés par tools/sync-core.js)
# + modules requis par server.js (lib/ est dans core/, le reste vient des
# node_modules de l'app). from: → chemin relatif au dossier du projet desktop.
extraResources:
  - from: core
    to: core
    filter:
      - "**/*"

mac:
  category: public.app-category.productivity
  icon: assets/icon.icns
  darkModeSupport: true

  # Deux cibles : le DMG pour l'installation, le ZIP pour l'auto-mise à jour
  # (Squirrel.mac exige un ZIP signé — electron-updater vérifie sa signature).
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]

  # ── Signature & notarisation ─────────────────────────────────────────
  # 100 % pilotées par l'environnement (convention electron-builder) :
  #   • CSC_NAME (identité "Developer ID Application: …") + secrets Apple
  #     → signature + hardened runtime + entitlements, puis notarisation
  #     via le hook afterSign (build/notarize.js)
  #   • CSC_IDENTITY_AUTO_DISCOVERY=false (local, CI sans secrets)
  #     → aucune signature, build ad-hoc (clic droit → Ouvrir)
  # Pas de clé `identity:` ici : la laisser décider à electron-builder
  # évite les comportements ambigus de la chaîne vide.
  hardenedRuntime: true
  gatekeeperAssess: false
  type: distribution
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist

  # electron-updater (provider GitHub) lit ces champs pour trouver les releases
  publish:
    - provider: github
      owner: DmzGamingYT
      repo: nova

  extendInfo:
    LSUIElement: true
    NSMicrophoneUsageDescription: Nova a besoin du micro pour t'écouter.
    NSAppleEventsUsageDescription: Nova utilise AppleScript pour contrôler ton Mac (volume, notifications).

dmg:
  title: Nova — Assistant IA vocal
  contents:
    - { x: 130, y: 220, type: file }
    - { x: 410, y: 220, type: link, path: /Applications }

# ── Windows ──────────────────────────────────────────────────────────────
win:
  icon: assets/icon.ico
  # NSIS : installeur classique, par machine (pas de Store, pas de dépendance
  # d'appx). L'app reste une app de barre des tâches / zone de notification.
  target:
    - target: nsis
      arch: [x64]

  publish:
    - provider: github
      owner: DmzGamingYT
      repo: nova

  # SGCB (SignalGC) n'est pas nécessaire ici ; l'app met simplement à jour
  # via electron-updater comme sur macOS dès qu'elle sera signée.

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: Nova-Setup-${version}-x64.exe
  shortcutName: Nova
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # Pas d'AutoLaunch au premier lancement : l'utilisateur garde la main.

# electron-updater sous Windows exige une cible qui se met à jour toute
# seule : NSIS est supporté (l'installeur se relance en mode mise à jour).
